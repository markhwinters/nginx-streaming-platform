global
    log stdout format raw local0
 
defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  50s
    timeout server  50s
 
frontend http_redirect
    bind *:80
    http-request redirect scheme https code 301

frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/localhost.crt

    acl is_video path_reg -i ^/video(/|$)
    acl is_api   path_reg -i ^/api(/|$)

    http-request redirect location /video/ code 301 if { path -i /video }
 
    use_backend varnish_backend if is_video
    use_backend api_backend     if is_api
    default_backend react_frontend
 
backend varnish_backend
    server varnish_srv varnish:80 check
 
backend api_backend
    http-request replace-path ^/api/?(.*)$ /\1
    server api_srv api:3001 check
 
backend react_frontend
    server react_srv frontend:3000 check
